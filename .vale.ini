# Vale prose linter configuration
# Run: make lint
# Sync styles: vale sync  (re-run after changing Packages)
# Docs: https://vale.sh/docs/

StylesPath = /Users/nathan/.config/vale/styles
MinAlertLevel = suggestion
Packages = write-good

# Apply to all Markdown files (posts, pages, portfolio)
[*.md]
BasedOnStyles = write-good

# E-Prime bans all uses of "to be" (is/are/was/were). Designed for
# academic writing; too noisy for technical prose.
write-good.E-Prime = NO

# Passive voice in security/technical writing is often the natural
# phrasing ("is enforced", "are implemented", "be subpoenaed").
# Demote to suggestion so it's visible but not counted as a warning.
write-good.Passive = suggestion

# TooWordy fires on technical terms that have no shorter equivalent
# ("implement", "aggregate", "requirement", "multiple").
# Demote to suggestion to surface real cases without blocking on jargon.
write-good.TooWordy = suggestion
